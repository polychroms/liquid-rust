name: Multi-Platform Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch_name }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch_name: x86_64
            target: x86_64-unknown-linux-gnu
            artifact: liquid-rust-linux-x86_64.tar.gz
            linker_pkg: ""
          - arch_name: ARM64
            target: aarch64-unknown-linux-gnu
            artifact: liquid-rust-linux-aarch64.tar.gz
            linker_pkg: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install system & cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libasound2-dev libudev-dev ${{ matrix.linker_pkg }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Linux tarball with liquid-rust-install.sh
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/liquid-rust dist/liquid-rust
          cp liquid-rust-install.sh dist/liquid-rust-install.sh
          chmod 0755 dist/liquid-rust dist/liquid-rust-install.sh
          tar -C dist -czvf dist/${{ matrix.artifact }} liquid-rust liquid-rust-install.sh
      - name: Upload Linux Tarball
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact }}
      - name: Upload Standalone Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.arch_name == 'x86_64'
        with:
          files: dist/liquid-rust-install.sh

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Package Windows ZIP
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/liquid-rust.exe dist/
          cd dist && 7z a liquid-rust-windows-x86_64.zip liquid-rust.exe
      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/liquid-rust-windows-x86_64.zip

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
            artifact: liquid-rust-macos-arm64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: liquid-rust-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Sign (optional Developer ID / ad-hoc) & package macOS tarball
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/liquid-rust dist/liquid-rust
          cp liquid-rust-install.sh dist/liquid-rust-install.sh
          chmod 0755 dist/liquid-rust dist/liquid-rust-install.sh

          if [[ -n "$APPLE_CERTIFICATE_P12" && -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
            security create-keychain -p ci-temp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci-temp build.keychain
            security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-temp build.keychain
            SIGN_ID="$(security find-identity -v -p codesigning build.keychain | head -n 1 | sed -n 's/.*"\(.*\)"/\1/p')"
            codesign --force --options runtime --timestamp --sign "$SIGN_ID" dist/liquid-rust
            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              ditto -c -k --keepParent dist/liquid-rust dist/liquid-rust-notarize.zip
              xcrun notarytool submit dist/liquid-rust-notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              rm -f dist/liquid-rust-notarize.zip
            fi
            rm -f cert.p12
          else
            codesign --force --sign - dist/liquid-rust
          fi

          COPYFILE_DISABLE=1 tar -C dist -czvf dist/${{ matrix.artifact }} liquid-rust liquid-rust-install.sh
      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact }}
